{{- if not .Values.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "platform-secrets" }}
{{- $d := dict }}
{{- if $existing }}{{ $d = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mariadb-root-password: {{ include "platform.secret" (dict "d" $d "k" "mariadb-root-password" "gen" true) | quote }}
  mariadb-password: {{ include "platform.secret" (dict "d" $d "k" "mariadb-password" "gen" true) | quote }}
  wp-admin-password: {{ include "platform.secret" (dict "d" $d "k" "wp-admin-password" "gen" true) | quote }}
  woo-consumer-key: {{ include "platform.secret" (dict "d" $d "k" "woo-consumer-key" "gen" true "p" "ck_") | quote }}
  woo-consumer-secret: {{ include "platform.secret" (dict "d" $d "k" "woo-consumer-secret" "gen" true "p" "cs_") | quote }}
  upstream-token: {{ include "platform.secret" (dict "d" $d "k" "upstream-token" "gen" true) | quote }}
  postgres-password: {{ include "platform.secret" (dict "d" $d "k" "postgres-password" "gen" true) | quote }}
  session-secret: {{ include "platform.secret" (dict "d" $d "k" "session-secret" "gen" true) | quote }}
  encryption-key: {{ include "platform.secret" (dict "d" $d "k" "encryption-key" "gen" true) | quote }}
  dashboard-admin-password: {{ include "platform.secret" (dict "d" $d "k" "dashboard-admin-password" "gen" true) | quote }}
  llm-api-key: {{ include "platform.secret" (dict "d" $d "k" "llm-api-key" "v" .Values.secrets.llmApiKey) | quote }}
{{- end }}
