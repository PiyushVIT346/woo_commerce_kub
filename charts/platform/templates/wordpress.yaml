apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.storage.wordpress }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: { app.kubernetes.io/name: wordpress }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: wordpress }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wordpress }
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          ports: [{ containerPort: 80 }]
          env:
            {{- include "platform.wpEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wordpress-data }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  selector: { app.kubernetes.io/name: wordpress }
  ports: [{ port: 80, targetPort: 80 }]
