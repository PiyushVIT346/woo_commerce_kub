---
{{- $env := printf "- name: PORT\n  value: \"3000\"\n- name: MODE\n  value: %s\n%s" $mode (include "platform.env" (dict "root" $ "name" "MCP_AUTH_TOKEN" "key" "upstream-token")) }}
