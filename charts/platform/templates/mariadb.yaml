apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mariadb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb }
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            {{- include "platform.env" (dict "root" . "name" "MARIADB_ROOT_PASSWORD" "key" "mariadb-root-password") | nindent 12 }}
            {{- include "platform.env" (dict "root" . "name" "MARIADB_PASSWORD" "key" "mariadb-password") | nindent 12 }}
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.storage.mariadb }} }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mariadb }
  ports: [{ port: 3306 }]
